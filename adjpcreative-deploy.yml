name: Deploy to adjpcreative.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env.php with Resend API key
        run: |
          echo "<?php define('RESEND_API_KEY', '${{ secrets.RESEND_API_KEY }}'); ?>" > .env.php

      - name: Deploy site to adjpcreative.com
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.gitignore
            **/.env.php.example
            **/serve.py
            **/__pycache__/**
